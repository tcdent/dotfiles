##### basics #####
set -g mouse on
bind -n MouseDrag1Border resize-pane -M
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1

##### never use the tmux command line/menus — a stray Ctrl-b can't open them #####
unbind-key -T prefix :
unbind-key -T prefix \$
unbind-key -T prefix \'
unbind-key -T prefix ,
unbind-key -T prefix .
unbind-key -T prefix /
unbind-key -T prefix f
unbind-key -T prefix <
unbind-key -T prefix >

##### mouse scroll targets pane under cursor #####
# If alternate screen (nvim, etc), send scroll to app; otherwise enter copy-mode
bind -n WheelUpPane select-pane -t= \; if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane select-pane -t= \; send-keys -M

##### window title (shown in Ghostty tab/window) #####
set -g set-titles on
set -g set-titles-string "#S"

##### colors #####
set -g pane-active-border-style "fg=magenta"

##### status bar: per-window-index color strip across the top #####
# Each window index maps to a terminal-palette named color (1=red 2=green
# 3=yellow 4=blue 5=magenta 6=cyan 7=white 8=brightred 9=brightgreen
# 10+=brightyellow). Inactive = number in its color; active = same color
# reversed (a highlight block on just the number). Renders per your theme.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=brightblack"
run-shell 'tmux set -g @userhost "$(id -un)@$(hostname -s)"'
set -g status-left "#[fg=brightblack] #{@userhost} #[default]"
set -g status-left-length 40
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "#[fg=#{?#{==:#{window_index},1},red,#{?#{==:#{window_index},2},green,#{?#{==:#{window_index},3},yellow,#{?#{==:#{window_index},4},blue,#{?#{==:#{window_index},5},magenta,#{?#{==:#{window_index},6},cyan,#{?#{==:#{window_index},7},white,#{?#{==:#{window_index},8},brightred,#{?#{==:#{window_index},9},brightgreen,brightyellow}}}}}}}}}] #I #[default]"
set -g window-status-current-format "#[fg=#{?#{==:#{window_index},1},red,#{?#{==:#{window_index},2},green,#{?#{==:#{window_index},3},yellow,#{?#{==:#{window_index},4},blue,#{?#{==:#{window_index},5},magenta,#{?#{==:#{window_index},6},cyan,#{?#{==:#{window_index},7},white,#{?#{==:#{window_index},8},brightred,#{?#{==:#{window_index},9},brightgreen,brightyellow}}}}}}}}},reverse,bold] #I #[default]"

##### auto-name sessions based on directory #####
set-hook -g session-created 'run-shell "tmux rename-session \"$(basename \"#{pane_current_path}\")\""'

##### pane resize with prefix + arrow keys #####
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

##### pane selection with Alt keys #####
bind -n M-` next-window
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9
bind -n M-0 select-pane -t 10

##### dev workspace #####
# 1. user
#   1.1 nvim
#   1.2 lead agent
#   1.3 user bash
#   1.4 user bash
bind w rename-window user \; \
  split-window -h -p 25 \; \
  select-pane -t 2 \; \
  split-window -v \; \
  split-window -v \; \
  select-pane -t 1 \; \
  send-keys 'nvim --listen /tmp/nvim-$(tmux display -p "#S").sock .' C-m \; \
  select-pane -t 2 \; \
  new-window -n agents \; \
  split-window -h -p 80 \; \
  select-pane -t 2 \; \
  split-window -h \; \
  select-pane -t 2 \; \
  split-window -h \; \
  select-pane -t 4 \; \
  split-window -h \; \
  select-pane -t 1 \; \
  split-window -v \; \
  select-pane -t 3 \; \
  split-window -v \; \
  select-pane -t 5 \; \
  split-window -v \; \
  select-pane -t 7 \; \
  split-window -v \; \
  select-pane -t 9 \; \
  split-window -v \; \
  split-window -v \; \
  split-window -v \; \
  select-pane -t 10 \; \
  split-window -v \; \
  select-pane -t 1 \; \
  select-window -t user


##### stats workspace: btop/lazypod top, irssi/shell/logs bottom #####
# prefix + e → system stats layout
bind e new-window -n stats \; \
  split-window -h -p 50 \; \
  select-pane -t 1 \; \
  split-window -v -p 50 \; \
  select-pane -t 3 \; \
  split-window -v -p 50 \; \
  select-pane -t 4 \; \
  split-window -h -p 50 \; \
  select-pane -t 1 \; \
  send-keys 'btop' C-m \; \
  select-pane -t 2 \; \
  send-keys 'lazypodman' C-m \; \
  select-pane -t 3 \; \
  send-keys 'irssi --home=~/.config/irssi' C-m \; \
  select-pane -t 5 \; \
  send-keys 'grc tail -f /var/log/*.log' C-m \; \
  select-pane -t 4

##### metrics workspace: btop top, ip/dmesg bottom #####
# prefix + m → wired display metrics layout
bind m new-window -n metrics \; \
  split-window -v -p 30 \; \
  split-window -h -p 55 \; \
  select-pane -t 1 \; \
  send-keys 'btop -t' C-m \; \
  select-pane -t 2 \; \
  send-keys 'watch --color \"ip -c address | grep inet\"' C-m \; \
  select-pane -t 3 \; \
  send-keys 'sudo dmesg -w' C-m \; \
  select-pane -t 1

##### show pane titles in border #####
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

##### env propagation into claude panes from ~/.env #####
run-shell '. ~/.env && tmux set-environment -g TWO_HOOK_PSK "$TWO_HOOK_PSK"'
